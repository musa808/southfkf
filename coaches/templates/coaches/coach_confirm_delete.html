{% extends "base.html" %}
{% block content %}
<h2>Delete Coach</h2>
<p>Are you sure you want to delete <strong>{{ object.full_name }}</strong>? This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'coaches:coach-list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
