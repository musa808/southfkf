{% extends "base.html" %}
{% block content %}
<h2>{% if object %}Edit Coach{% else %}Add Coach{% endif %}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
        {% for field in form %}
        <div class="col-md-6 mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'coaches:coach-list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
